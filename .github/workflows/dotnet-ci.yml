name: Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build the API and run unit tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2-API/RaceDay.slnx

      - name: Build
        run: dotnet build Part2-API/RaceDay.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.slnx --no-build --configuration Release --verbosity normal