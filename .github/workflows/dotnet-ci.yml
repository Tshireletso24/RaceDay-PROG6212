name: Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build the API and MVC app, run unit tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API solution
        run: dotnet restore Part2-API/RaceDay.slnx

      - name: Build API and tests
        run: dotnet build Part2-API/RaceDay.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2-API/RaceDay.slnx --no-build --configuration Release --verbosity normal

      - name: Restore MVC app
        run: dotnet restore Part3-Web/RaceDay.Web/RaceDay.Web.csproj

      - name: Build MVC app
        run: dotnet build Part3-Web/RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    name: Build the MVC Docker image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t raceday-web Part3-Web/RaceDay.Web
