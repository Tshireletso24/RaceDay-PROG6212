name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    name: Check /docs folder and required Part 1 files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check for ERD file
        run: |
          if ! find docs -iname "*erd*" | grep -q .; then
            echo "ERROR: No ERD file found in /docs (expected a filename containing 'ERD')."
            exit 1
          fi
          echo "ERD file found."

      - name: Check for SQL script
        run: |
          if ! find docs -iname "*.sql" | grep -q .; then
            echo "ERROR: No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check for Endpoint Plan document
        run: |
          if ! find docs -iname "*endpoint*" | grep -q .; then
            echo "ERROR: No endpoint plan document found in /docs."
            exit 1
          fi
          echo "Endpoint plan document found."

      - name: Check README.md exists at repo root
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid. All required Part 1 files are present."
